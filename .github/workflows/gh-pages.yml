name: github pages

on:
  push:
    branches: [main]
    paths: ['content/**', 'site.yml', '.github/workflows/gh-pages.yml']
  pull_request:
    branches: [main]
    paths: ['content/**', 'site.yml', '.github/workflows/gh-pages.yml']
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Antora and extensions
        run: npm i -g @antora/cli@3.1 @antora/site-generator@3.1 @sntke/antora-mermaid-extension@0.0.9
      - name: Build site
        run: |
          antora --fetch site.yml
          cp -r www/_ www/workshop-ansible-ifpb/_
          find www/workshop-ansible-ifpb -name '*.html' -exec sed -i 's|\.\./\_/|_/|g' {} +
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www/workshop-ansible-ifpb

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
